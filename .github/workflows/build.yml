name: build-sub2api-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sub2api-tunnel
  CLOUDFLARED_VERSION: "2026.9.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（GITHUB_TOKEN 自动授权）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            CLOUDFLARED_VERSION=${{ env.CLOUDFLARED_VERSION }}
          tags: |
            ${{ env.IMAGE }}:0.2.7-cfl-${{ env.CLOUDFLARED_VERSION }}
            ${{ env.IMAGE }}:latest

      - name: 验证包可匿名访问（GHCR Registry v2 认证流）
        run: |
          set -e
          for t in latest 0.2.7-cfl-${{ env.CLOUDFLARED_VERSION }}; do
            TOK=$(curl -s "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/sub2api-tunnel:pull&service=ghcr.io" | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOK" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${{ github.repository_owner }}/sub2api-tunnel/manifests/$t")
            echo "tag=$t anon_http=$code"
            test "$code" = "200"
          done